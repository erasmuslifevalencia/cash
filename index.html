<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELV Cash</title>
<meta name="theme-color" content="#1B1430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: dark side menu (bottom bar on phones) + work area. Ink on light grey, orange for actions. */
:root{
  --bg:#F3F4F6; --card:#FFFFFF; --ink:#16161D; --muted:#5F6170; --line:#E3E4E9; --line2:#D5D7DE; --soft:#ECEDF1;
  --nav:#1B1430; --nav2:#2E2350; --navtext:#E4E0EE; --navmuted:#C9C2DD;
  --o:#C2410C; --o-dark:#9A3412; --o-soft:#FFF1E8;
  --ok:#17663A; --ok-soft:#E7F5EC; --warn:#8A4B00; --warn-line:#F3C677; --warn-soft:#FFF7E6; --bad:#8E1E15; --bad-soft:#FBE3E0;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-size:18px;font-weight:800}

/* shell */
.shell{min-height:100vh;display:flex}
.side{flex:0 0 240px;background:var(--nav);color:#fff;padding:20px 14px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px}
.brand img{width:64px;height:auto}
.brand b{display:block;font-size:18px;font-weight:800}.brand span{font-size:12px;color:var(--navmuted)}
.nav{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;color:var(--navtext);font-weight:600;background:none;border:0;cursor:pointer;text-align:left;width:100%}
.nav:hover{background:#271E44}
.nav.on{background:var(--nav2);color:#fff;font-weight:700}
.nav svg{flex:none}
.badge{margin-left:auto;background:#F59E0B;color:var(--nav);font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid #3A2F5C}
.av{width:34px;height:34px;border-radius:50%;background:#F07A2E;color:var(--nav);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.me .who{min-width:0;display:flex;flex-direction:column}.me .who b{font-size:14px}.me .who span{font-size:12px;color:var(--navmuted);overflow:hidden;text-overflow:ellipsis}
.linkbtn{background:none;border:0;padding:0;color:var(--navmuted);font-size:12px;text-decoration:underline;cursor:pointer;text-align:left}
.work{flex:1;min-width:0;padding:28px 32px 40px;display:flex;flex-direction:column;gap:18px}
.bottom{display:none}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.top p{margin:4px 0 0;color:var(--muted)}
.pill{font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

/* cards, forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col-main{flex:3 1 420px;min-width:0;display:flex;flex-direction:column;gap:18px}
.col-side{flex:2 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px;position:sticky;top:20px}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{font-size:16px;font-weight:500;color:var(--ink);padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:#fff;width:100%;min-width:0}
.inp:focus{border-color:var(--o);outline:none;box-shadow:0 0 0 3px #FCD9C4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.who-chip{font-weight:600;padding:10px 16px;border-radius:999px;border:1px solid var(--line2);background:#fff;cursor:pointer}
.who-chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;border:2px solid var(--line2);border-radius:10px;background:#fff}
.search:focus-within{border-color:var(--o)}
.search input{flex:1;min-width:0;border:0;outline:none;padding:12px 0;font-size:16px;background:none}
.results{border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:380px;overflow-y:auto}
.grp{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp b{font-size:14px}
.price{font-size:14px;font-weight:600;padding:9px 12px;border-radius:9px;border:1px solid var(--line2);background:#fff;cursor:pointer}
.price:hover{border-color:var(--o);background:var(--o-soft)}
.price span{font-family:var(--mono);color:var(--muted);margin-left:4px}
.price.promo{background:#FFF8F2}
.price:disabled{opacity:.45;cursor:default;text-decoration:line-through;background:#fff}
.hint{padding:12px 16px;background:#F7F7F9;font-size:13px;color:var(--muted)}
.ghost{font-weight:600;padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:#fff;cursor:pointer;white-space:nowrap}
.ghost:hover{border-color:var(--ink)}
.ghost.sm{font-size:13px;padding:8px 12px;border-radius:9px}
.primary{font-size:16px;font-weight:800;padding:16px;border:0;border-radius:12px;background:var(--o);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.primary:hover{background:var(--o-dark)}
.primary:disabled,.ghost:disabled{opacity:.5;cursor:default}
.line{display:grid;grid-template-columns:minmax(0,1fr) 64px 104px 34px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}
.line .name{font-weight:700;overflow-wrap:anywhere}
.line input{font-family:var(--mono);font-size:15px;text-align:right;padding:8px;border:1px solid var(--line2);border-radius:8px;width:100%;min-width:0}
.x{width:34px;height:34px;border:0;background:#F3F4F6;border-radius:8px;color:var(--muted);font-size:18px;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total .mono{font-size:30px;font-weight:600}
.bo{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:var(--warn-soft);border:1px solid var(--warn-line);font-size:14px;cursor:pointer}
.bo input{width:22px;height:22px;margin:0;accent-color:var(--o);flex:none}
.bo.ok{background:var(--ok-soft);border-color:#A9DBBB}
.bo.need{border:2px solid var(--bad);background:var(--bad-soft)}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:0}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* today */
.daynav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sq{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:18px;cursor:pointer}
.datepick{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line2);border-radius:10px;background:#fff}
.sum{display:flex;flex-wrap:wrap;gap:18px 40px;align-items:flex-end}
.big{font-family:var(--mono);font-size:36px;font-weight:600;letter-spacing:-.02em}
.who-pill{background:#F3F4F6;border-radius:999px;padding:6px 12px;font-size:13px}
.who-pill b{font-family:var(--mono)}
.warnbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:12px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list .head{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:130px minmax(0,1fr) 110px 300px;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--soft)}
.row:last-child{border-bottom:0}
.row.todo{box-shadow:inset 4px 0 0 #F59E0B;background:#FFFBF2}
.row.void{color:#6B6D7A}
.row.void .strike{text-decoration:line-through}
.row .no{font-family:var(--mono);font-weight:600}
.row .sub{font-size:13px;color:var(--muted)}
.row .amt{text-align:right;grid-column:3;grid-row:1}
.row .who{grid-column:2;grid-row:1}
.row .acts{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.okchip{font-size:13px;font-weight:700;padding:8px 12px;border-radius:9px;background:var(--ok-soft);color:var(--ok);border:0;cursor:pointer}
.todochip{font-size:13px;font-weight:700;padding:8px 12px;border-radius:9px;border:1px solid #E8A33A;background:#fff;color:var(--warn);cursor:pointer}
.tag{font-size:11px;font-weight:800;letter-spacing:.4px;border-radius:6px;padding:2px 7px}
.tag.void{background:var(--bad-soft);color:#A3241A}.tag.rent{color:#34408F;padding:0}
.more{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
.more:hover{color:var(--bad)}

/* till */
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.tcard .t{font-weight:700}.tcard .s{font-size:13px;color:var(--muted)}
.tcard .v{font-family:var(--mono);font-size:28px;font-weight:600}
.tcard.dark{background:var(--nav);color:#fff;border-color:var(--nav)}.tcard.dark .s{color:var(--navmuted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.money{font-family:var(--mono);font-size:20px;font-weight:600}
.diff{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;font-weight:700}
.diff.ok{background:var(--ok-soft);color:var(--ok)}.diff.bad{background:var(--bad-soft);color:var(--bad)}.diff.plus{background:#E8F0FB;color:#1E4E8C}
.hist{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:12px;padding:12px 20px;border-bottom:1px solid var(--soft);align-items:center}
.hist:last-child{border-bottom:0}
.hist .r{text-align:right}
.res{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.res.ok{background:var(--ok-soft);color:var(--ok)}.res.bad{background:var(--bad-soft);color:var(--bad)}.res.plus{background:#E8F0FB;color:#1E4E8C}

/* sign-in screen */
.gate{min-height:100vh;background:var(--nav);display:flex;align-items:center;justify-content:center;padding:24px}
.gate .box{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:36px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.gate img{width:150px;height:auto}
.gate p{margin:0;color:var(--muted)}
#gbtn{min-height:44px}

/* dialogs and toast */
dialog{border:0;border-radius:16px;padding:0;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(27,20,48,.55)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg .btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100vw - 32px)}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted)}

/* saved receipt panel */
.sheetwrap{overflow-x:auto;background:#E9EAEE;border-radius:14px;padding:16px}
#sheet{background:#fff;margin:0 auto;width:210mm;box-shadow:0 2px 14px rgba(0,0,0,.08)}

/* receipt (printed A4: two halves of 148 mm) */
.rcpt{position:relative;height:148mm;padding:11mm 14mm 9mm;font:11pt/1.35 Arial,Helvetica,sans-serif;color:#111;overflow:hidden;background:#fff}
.rcpt + .rcpt{border-top:1px dashed #999}
.rcpt .rtop{display:flex;justify-content:space-between;gap:10mm}
.rcpt .rbrand{display:flex;align-items:center;gap:3mm;font-size:15pt;font-weight:700}
.rcpt .rbrand img{width:18mm;height:auto}
.rcpt .legal{font-size:8.5pt;color:#444;margin-top:2px}
.rcpt .rtitle{text-align:right}
.rcpt .rtitle h3{margin:0;font-size:15pt;letter-spacing:1px}
.rcpt .rno{font-size:12pt;font-weight:700;color:#C2410C}
.rcpt .copy{font-size:8pt;text-transform:uppercase;color:#666;margin-top:3px}
.rcpt .rwho{margin:5mm 0 4mm;padding:3mm 4mm;background:#f5f5f5;border-radius:2mm;display:grid;grid-template-columns:1fr 1fr;gap:1mm 8mm;font-size:10pt}
.rcpt .rwho small{color:#666;display:block;font-size:7.5pt;text-transform:uppercase;letter-spacing:.3px}
.rcpt table{width:100%;border-collapse:collapse;font-size:10pt}
.rcpt th{text-align:left;font-size:7.5pt;text-transform:uppercase;color:#555;border-bottom:1.2pt solid #111;padding:1.5mm 1mm}
.rcpt td{padding:1.6mm 1mm;border-bottom:.5pt solid #ddd}
.rcpt .num{text-align:right;white-space:nowrap}
.rcpt .rtot{display:flex;justify-content:flex-end;gap:8mm;font-size:13pt;font-weight:700;margin-top:3mm}
.rcpt .pay{margin-top:3mm;font-size:9.5pt}
.rcpt .sign{position:absolute;left:14mm;right:14mm;bottom:14mm;display:flex;justify-content:space-between;align-items:flex-end;font-size:9pt}
.rcpt .sign .l{border-top:.6pt solid #111;width:62mm;padding-top:1mm;text-align:center;color:#444}
.rcpt .foot{position:absolute;left:14mm;right:14mm;bottom:6mm;font-size:7.5pt;color:#666;text-align:center}
.rcpt .stamp{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);font-size:46pt;font-weight:800;color:rgba(192,57,43,.28);border:5pt solid rgba(192,57,43,.28);padding:2mm 8mm;border-radius:4mm;white-space:nowrap}
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;width:210mm}
}

/* phones and narrow windows */
@media (max-width:820px){
  .shell{display:block}
  .side{display:none}
  .work{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .mobilehead{display:flex!important}
  .bottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
  .bottom button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;position:relative;cursor:pointer}
  .bottom button.on{color:var(--o);font-weight:800}
  .bottom .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0;padding:0 6px}
  h1{font-size:24px}
  .col-side{position:static}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .row .amt{grid-column:2;grid-row:1}
  .row .who{grid-column:1/-1;grid-row:2}
  .row .acts{grid-column:1/-1;justify-content:flex-start}
  .tri{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .hist{grid-template-columns:minmax(0,1fr) auto}
  .hist .hide-s{display:none}
  .big{font-size:30px}
}
.mobilehead{display:none;align-items:center;gap:10px;background:var(--nav);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;position:sticky;top:0;z-index:15}
.mobilehead img{width:44px}
.mobilehead b{font-size:17px}
.mobilehead .av{margin-left:auto;width:32px;height:32px;font-size:13px;border:0;cursor:pointer}
</style>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
<div id="app"><div class="loading">Loading ELV Cash…</div></div>
<div id="printArea"></div>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
</body>
</html>
